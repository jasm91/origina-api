<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cotizador · Origina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>html,body{margin:0;padding:0;background:#E7E6E3}#boot{font-family:system-ui,sans-serif;color:#8C8C88;text-align:center;padding:48px 16px}</style>

  <script>
    /* Hosting del cotizador dentro del backend Origina v3.
       - OG_API apunta al endpoint clave→valor de Node/Postgres (aislado por tenant).
       - OG_TOKEN es el MISMO JWT de la sesión de la app v3 (localStorage 'ov3_token').
       Si no hay sesión, volvemos al login de la app. */
    (function () {
      var token = '';
      try { token = localStorage.getItem('ov3_token') || ''; } catch (e) {}
      if (!token) { window.location.replace('/login'); return; }
      window.OG_API = '/api/og';
      window.OG_TOKEN = token;
    })();
  </script>
</head>
<body>
  <div id="root"><div id="boot">Cargando cotizador…</div></div>
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = '/cotizador/app.bundle.js?v=' + Date.now();
      s.onerror = function () {
        var b = document.getElementById('boot');
        if (b) b.textContent = 'No se pudo cargar el cotizador.';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
